name: Build Android APK (direct, Gradle)

# Manual trigger only. Builds an Android APK directly on the GitHub-hosted
# runner with `expo prebuild` + `./gradlew assembleRelease`, no EAS Build
# minutes consumed. The APK is signed with the auto-generated debug
# keystore — fine for personal testing, not for distribution.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-direct-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Direct APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (accept licenses)
        uses: android-actions/setup-android@v3

      - name: Show environment
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "java: $(java -version 2>&1 | head -1)"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Install npm deps
        run: npm ci

      # Compute the values that will become EXPO_PUBLIC_BUILD_* env vars for
      # both Metro and app.config.js. Step output is reused by later steps
      # and by the artifact name.
      - name: Capture build metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building dwhi v${APP_VERSION} @ ${SHORT_SHA} (run #${GITHUB_RUN_NUMBER}) at ${BUILD_TIME}"

      # Write build env to .env. `expo prebuild` and the Metro bundle Gradle
      # invokes auto-load this file via Expo CLI, so the values end up
      # inlined into the JS bundle AND copied into expoConfig.extra by
      # app.config.js. File redirection only — secrets never hit step logs.
      - name: Write build-time .env from repo secrets + metadata
        env:
          OPENAI_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.EXPO_PUBLIC_OPENAI_MODEL }}
          BUILD_COMMIT: ${{ steps.meta.outputs.short_sha }}
          BUILD_RUN: ${{ github.run_number }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          umask 077
          {
            if [ -n "${OPENAI_KEY}" ]; then
              printf 'EXPO_PUBLIC_OPENAI_API_KEY=%s\n' "${OPENAI_KEY}"
            fi
            if [ -n "${OPENAI_MODEL}" ]; then
              printf 'EXPO_PUBLIC_OPENAI_MODEL=%s\n' "${OPENAI_MODEL}"
            fi
            printf 'EXPO_PUBLIC_BUILD_COMMIT=%s\n' "${BUILD_COMMIT}"
            printf 'EXPO_PUBLIC_BUILD_RUN=%s\n' "${BUILD_RUN}"
            printf 'EXPO_PUBLIC_BUILD_TIME=%s\n' "${BUILD_TIME}"
          } > .env
          if [ -n "${OPENAI_KEY}" ]; then
            echo "OpenAI key present: yes (length: ${#OPENAI_KEY})"
          else
            echo "::warning::OpenAI key empty/unset — APK will use the mock parser."
          fi
          echo "Build metadata: commit=${BUILD_COMMIT} run=${BUILD_RUN} time=${BUILD_TIME}"

      # Fail the build if the Jest suite is red. We run this before
      # typecheck/prebuild/Gradle so a logic regression doesn't waste
      # ~10 minutes on an APK that ships with a broken engine.
      - name: Run unit tests
        run: npm test -- --ci --colors=false

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate Expo config
        run: npx expo config --type prebuild > /dev/null

      - name: Expo prebuild (Android only, clean)
        # --clean rebuilds android/ from scratch so a stale prebuild can't
        # leak in. --non-interactive prevents any prompt from hanging CI.
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: List build outputs
        if: always()
        run: |
          ls -la android/app/build/outputs/apk/release/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwhi-android-apk-${{ steps.meta.outputs.app_version }}-${{ steps.meta.outputs.short_sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Reminder
        if: always()
        run: |
          echo "::notice::APK artifact: dwhi-android-apk-${{ steps.meta.outputs.app_version }}-${{ steps.meta.outputs.short_sha }}"
          echo "::warning::APK has OpenAI key inlined. Do not distribute. Rotate the key on https://platform.openai.com/api-keys when done testing."
