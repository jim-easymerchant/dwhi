name: Build Android APK (direct, Gradle)

# Manual trigger only. Builds an Android APK directly on the GitHub-hosted
# runner with `expo prebuild` + `./gradlew assembleRelease`, no EAS Build
# minutes consumed. The APK is signed with the auto-generated debug
# keystore — fine for personal testing, not for distribution.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-direct-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Direct APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # JOB-LEVEL env so every step (npm scripts, npx expo config, expo
    # prebuild, gradle) sees the EXPO_PUBLIC_* values directly via
    # process.env — independently of the .env file write below. This is
    # the belt; the file is the braces.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_OPENAI_API_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
      EXPO_PUBLIC_OPENAI_MODEL: ${{ secrets.EXPO_PUBLIC_OPENAI_MODEL }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (accept licenses)
        uses: android-actions/setup-android@v3

      - name: Show environment
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"
          echo "java: $(java -version 2>&1 | head -1)"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"

      - name: Install npm deps
        run: npm ci

      # Compute the values that will become EXPO_PUBLIC_BUILD_* env vars for
      # both Metro and app.config.js. Step output is reused by later steps
      # and by the artifact name.
      - name: Capture build metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building dwhi v${APP_VERSION} @ ${SHORT_SHA} (run #${GITHUB_RUN_NUMBER}) at ${BUILD_TIME}"

      # Write every EXPO_PUBLIC_* var to .env so Expo CLI's auto-dotenv
      # picks them up too (used by prebuild + Metro). The job-level env
      # block above also exports them directly, so both paths agree.
      # File redirection only — secrets never hit step logs; only their
      # length / presence is echoed.
      - name: Write build-time .env from repo secrets + metadata
        env:
          BUILD_COMMIT: ${{ steps.meta.outputs.short_sha }}
          BUILD_RUN: ${{ github.run_number }}
          BUILD_TIME: ${{ steps.meta.outputs.build_time }}
        run: |
          umask 077
          {
            if [ -n "${EXPO_PUBLIC_OPENAI_API_KEY}" ]; then
              printf 'EXPO_PUBLIC_OPENAI_API_KEY=%s\n' "${EXPO_PUBLIC_OPENAI_API_KEY}"
            fi
            if [ -n "${EXPO_PUBLIC_OPENAI_MODEL}" ]; then
              printf 'EXPO_PUBLIC_OPENAI_MODEL=%s\n' "${EXPO_PUBLIC_OPENAI_MODEL}"
            fi
            if [ -n "${EXPO_PUBLIC_SUPABASE_URL}" ]; then
              printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "${EXPO_PUBLIC_SUPABASE_URL}"
            fi
            if [ -n "${EXPO_PUBLIC_SUPABASE_ANON_KEY}" ]; then
              printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "${EXPO_PUBLIC_SUPABASE_ANON_KEY}"
            fi
            printf 'EXPO_PUBLIC_BUILD_COMMIT=%s\n' "${BUILD_COMMIT}"
            printf 'EXPO_PUBLIC_BUILD_RUN=%s\n' "${BUILD_RUN}"
            printf 'EXPO_PUBLIC_BUILD_TIME=%s\n' "${BUILD_TIME}"
          } > .env
          # SAFE per-var diagnostic — presence + length only. Never the value.
          echo "----- EXPO_PUBLIC_* presence -----"
          for name in \
            EXPO_PUBLIC_OPENAI_API_KEY \
            EXPO_PUBLIC_OPENAI_MODEL \
            EXPO_PUBLIC_SUPABASE_URL \
            EXPO_PUBLIC_SUPABASE_ANON_KEY \
            EXPO_PUBLIC_BUILD_COMMIT \
            EXPO_PUBLIC_BUILD_RUN \
            EXPO_PUBLIC_BUILD_TIME; do
            val="$(printenv "$name" || true)"
            if [ -n "$val" ]; then
              echo "${name}: present (length ${#val})"
            else
              echo "::warning::${name}: missing"
            fi
          done
          echo "----------------------------------"

      # Fail the build if the Jest suite is red. We run this before
      # typecheck/prebuild/Gradle so a logic regression doesn't waste
      # ~10 minutes on an APK that ships with a broken engine.
      - name: Run unit tests
        run: npm test -- --ci --colors=false

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate Expo config
        # `expo config --type prebuild` triggers app.config.js evaluation,
        # which is the surface that logs "[dwhi] Supabase configured: yes/no".
        # Tailing the output makes the answer visible without dumping the
        # whole config block.
        run: |
          set -e
          npx expo config --type prebuild | grep -E '^\[dwhi\]' || true
          npx expo config --type prebuild > /dev/null

      - name: Expo prebuild (Android only, clean)
        # --clean rebuilds android/ from scratch so a stale prebuild can't
        # leak in. --non-interactive prevents any prompt from hanging CI.
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: List build outputs
        if: always()
        run: |
          ls -la android/app/build/outputs/apk/release/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dwhi-android-apk-${{ steps.meta.outputs.app_version }}-${{ steps.meta.outputs.short_sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Reminder
        if: always()
        run: |
          echo "::notice::APK artifact: dwhi-android-apk-${{ steps.meta.outputs.app_version }}-${{ steps.meta.outputs.short_sha }}"
          echo "::warning::APK has OpenAI + Supabase keys inlined. Do not distribute. Rotate keys after testing."
