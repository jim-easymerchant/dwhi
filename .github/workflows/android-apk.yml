name: Build Android APK (EAS, preview)

# Manual trigger only. There is no push/PR trigger — EAS builds cost minutes
# and we don't want to spend them on every commit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Expo + EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Push the secrets into the EAS-managed environment for the `preview`
      # build profile. This is the official EAS path for injecting build-time
      # secrets — EAS populates the build worker's process.env with these
      # values before Metro bundles. They are stored encrypted (--visibility
      # secret) and overwritten each run with --force.
      #
      # SAFE diagnostics only: key length and presence — never the value,
      # never the last-N characters.
      - name: Push OpenAI key + model to EAS preview env
        env:
          OPENAI_KEY: ${{ secrets.EXPO_PUBLIC_OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.EXPO_PUBLIC_OPENAI_MODEL }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          if [ -n "${OPENAI_KEY}" ]; then
            echo "OpenAI key present: yes (length: ${#OPENAI_KEY})"
            eas env:create \
              --scope project \
              --environment preview \
              --name EXPO_PUBLIC_OPENAI_API_KEY \
              --value "${OPENAI_KEY}" \
              --visibility secret \
              --non-interactive \
              --force
          else
            echo "::warning::EXPO_PUBLIC_OPENAI_API_KEY secret is empty or unset. APK will use the mock parser."
          fi
          if [ -n "${OPENAI_MODEL}" ]; then
            echo "OpenAI model override: ${OPENAI_MODEL}"
            eas env:create \
              --scope project \
              --environment preview \
              --name EXPO_PUBLIC_OPENAI_MODEL \
              --value "${OPENAI_MODEL}" \
              --visibility plaintext \
              --non-interactive \
              --force
          else
            echo "OpenAI model: using default (gpt-4o-mini)"
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Validate Expo config
        run: npx expo config --type prebuild > /dev/null

      - name: EAS Android APK build (preview profile)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive

      - name: Reminder
        if: always()
        run: |
          echo "::notice::APK link: see the most recent build on the Expo dashboard for this project."
          echo "::warning::This APK has the OpenAI key bundled into the JS. Do not distribute. Rotate the key on https://platform.openai.com/api-keys when done."
